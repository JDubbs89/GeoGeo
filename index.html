<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♪GeoGeo♪</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/tone"></script>
    <script src="js/music.js"></script>
    <script type="importmap">
        {"imports": {
            "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.4/dist/leaflet.js",
            "density-clustering": "https://esm.sh/density-clustering@1.3.0",
            "concaveman": "https://esm.sh/concaveman@2.0.0"
        }}
	</script>
</head>
<body class="display">
    <div id="map" class="map">
        <script type="module" src="js/map.js"></script>
    </div>
    <div class="sidebar">
        <h2>What does the Climate Sound Like?</h2>
        <!-- <p id="data-status" role="status">Loading matching coordinates…</p> -->
        <div class="sliders">
            <label for="threshold">Greenhouse Gas Emissions (2016)</label>
            <input type="range" min="0" max="100" value="50" step="1" id="threshold" aria-describedby="threshold-value">
            <output id="threshold-value" for="threshold"></output>
        </div>
        <button id="play_button" onclick="playSlider(document.getElementById('threshold').value)">Play</button>
    </div>
</body>
</html>
