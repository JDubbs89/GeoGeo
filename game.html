<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♪GeoGeoGeo♪</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script defer src="https://www.webglearth.com/v2/api.js"></script>
    <script src="https://unpkg.com/tone"></script>
    <script defer src="js/music.js"></script>
    <script type="importmap">
        {"imports": {
            "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.4/dist/leaflet.js",
            "density-clustering": "https://esm.sh/density-clustering@1.3.0",
            "concaveman": "https://esm.sh/concaveman@2.0.0"
        }}
	</script>
    <script type="module" src="js/game.js"></script>
</head>
<body class="display game-screen">
    <div id="left-area" class="left-area">
        <div id="playSound" class="playSound">
            <button type="button" id="playGoalButton" class="playButton" aria-label="Play goal sound" title="Play goal sound" disabled>▶</button>
            <progress id="playProgress" class="playProgress" max="3000" value="0" aria-label="Audio playback progress"></progress>
        </div>
        <div id="map" class="map" data-guess-map>
            <script type="module" src="js/map.js?v=7"></script>
        </div>
    </div>
    <div class="sidebar">
        <h2 id="game-heading">What does the Climate Sound Like?</h2>
        <p id="game-status" role="status">Loading a new round…</p>
        <section id="game-results" class="game-results" role="status" aria-atomic="true" aria-labelledby="game-heading" hidden>
            <dl>
                <div>
                    <dt>Location</dt>
                    <dd><span id="result-location-score" data-result-value></span> / <span id="result-location-max" data-result-value></span> points</dd>
                </div>
                <div>
                    <dt>Sound</dt>
                    <dd><span id="result-slider-score" data-result-value></span> / <span id="result-slider-max" data-result-value></span> points</dd>
                </div>
                <div>
                    <dt>Total</dt>
                    <dd><span id="result-total-score" data-result-value></span> / <span id="result-total-max" data-result-value></span> points</dd>
                </div>
            </dl>
            <table>
                <caption>Slider measurements (nearest readings)</caption>
                <thead>
                    <tr><th scope="col">Pollutant</th><th scope="col">Your guess</th><th scope="col">Target</th><th scope="col">Error</th></tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">CO₂<br><small>ppm</small></th>
                        <td id="result-c02-guess" data-result-value></td>
                        <td id="result-c02-target" data-result-value></td>
                        <td id="result-c02-error" data-result-value></td>
                    </tr>
                    <tr>
                        <th scope="row">CH₄<br><small>Mg yr⁻¹ km⁻²</small></th>
                        <td id="result-ch4-guess" data-result-value></td>
                        <td id="result-ch4-target" data-result-value></td>
                        <td id="result-ch4-error" data-result-value></td>
                    </tr>
                    <tr>
                        <th scope="row">NO₂<br><small>ppbv</small></th>
                        <td id="result-n02-guess" data-result-value></td>
                        <td id="result-n02-target" data-result-value></td>
                        <td id="result-n02-error" data-result-value></td>
                    </tr>
                </tbody>
            </table>
            <p>Click Replay to play again.</p>
        </section>
        <!-- <p id="data-status" role="status">Loading matching coordinates…</p> -->
        <div class="sliders">
            <label for="c02-threshold">CO₂ concentration</label>
            <div class="slider-row">
                <input class="slider" type="range" min="0" max="100" value="50" step="1" id="c02-threshold" aria-describedby="c02-band c02-units">
                <div class="slider-reading">
                    <output id="c02-band" class="slider-band" for="c02-threshold" aria-label="CO₂ concentration range in ppm">Loading…</output>
                    <span id="c02-units" class="slider-band-units">ppm</span>
                </div>
            </div>
            <label for="ch4-threshold">CH₄ emissions</label>
            <div class="slider-row">
                <input class="slider" type="range" min="0" max="100" value="50" step="1" id="ch4-threshold" aria-describedby="ch4-band ch4-units">
                <div class="slider-reading">
                    <output id="ch4-band" class="slider-band" for="ch4-threshold" aria-label="CH₄ emissions range in Mg per year per square kilometer">Loading…</output>
                    <span id="ch4-units" class="slider-band-units">Mg yr⁻¹ km⁻²</span>
                </div>
            </div>
            <label for="n02-threshold">NO₂ concentration</label>
            <div class="slider-row">
                <input class="slider" type="range" min="0" max="100" value="50" step="1" id="n02-threshold" aria-describedby="n02-band n02-units">
                <div class="slider-reading">
                    <output id="n02-band" class="slider-band" for="n02-threshold" aria-label="NO₂ concentration range in ppbv">Loading…</output>
                    <span id="n02-units" class="slider-band-units">ppbv</span>
                </div>
            </div>
            <p id="threshold-value" role="status" hidden></p>
        </div>
        <button type="button" id="play_button" class="playButton" aria-label="Play slider sound" title="Play slider sound" disabled>▶</button>
        <p id="audio-status" role="status" hidden></p>
        <div class="game-controls">    
            <button class="replay-button" type="button" id="start-game" hidden disabled>Play Again</button>
            <button class="submit-button" type="button" id="submit-guess" disabled>GeoGeoGeo!</button>
        </div>
    </div>
</body>
</html>
